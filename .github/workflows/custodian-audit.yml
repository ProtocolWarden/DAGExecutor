name: custodian-audit

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install custodian
        run: pip install "custodian @ git+https://github.com/ProtocolWarden/Custodian.git@main"
      - name: Run custodian audit
        env:
          REPOGRAPH_BOUNDARY_ARTIFACT_FILE: ${{ secrets.REPOGRAPH_BOUNDARY_ARTIFACT_FILE_PATH }}
        run: custodian-multi --repos . --fail-on-findings --no-color
