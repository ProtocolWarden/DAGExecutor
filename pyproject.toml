[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dag-executor"
version = "0.1.0"
description = "DAG execution engine for the owned execution topology layer"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "rustworkx>=0.15",
  "orjson>=3.9",
  "rxp @ git+https://github.com/ProtocolWarden/RxP.git",
  "cxrp @ git+https://github.com/ProtocolWarden/CxRP.git@v0.3.0",
  "core-runner @ git+https://github.com/ProtocolWarden/CoreRunner.git",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "custodian @ git+https://github.com/ProtocolWarden/Custodian.git@d6ba8ab245c6f4e79e9f8fffd4e4221bfaf266e8",
]

[project.scripts]
dag-executor = "dag_executor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
  "integration: requires live external service",
]

[tool.ruff]
line-length = 100
target-version = "py311"
