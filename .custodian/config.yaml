repo_key: DAGExecutor
src_root: src/dag_executor
tests_root: tests

audit:
  # This repo's .console/ is reconciled + clean + under budget — enforce R1/R2.
  reconcile_enforce: true
  # config.py is the designated environment-access layer (C13).
  c13_allowed_paths:
    - "src/dag_executor/config.py"

# ---------------------------------------------------------------------------
# Privacy / boundary enforcement (Custodian B-class)
# ---------------------------------------------------------------------------
privacy:
  require_boundary_artifact: true
  # No baked-in artifact path: the pre-push hook / CI resolve and export
  # REPOGRAPH_BOUNDARY_ARTIFACT_FILE by role. Absent env => B2 fails closed.
